<!doctype html>
<html lang="ro">

<head>
    <meta charset="utf-8">
    <title>Rezervare DHCP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">
            <strong>Rezervare DHCP</strong>
        </div>

        <div class="card-body">
	<form method="post" action="/save">

            <div class="mb-3">
                <label class="form-label">Hostname</label>
                <input
                    class="form-control"
                    name="hostname"
		    value="{{ lease.hostname }}">
            </div>

            <div class="mb-3">
                <label class="form-label">IP</label>
                <input
                    class="form-control"
                    name="ip"
                    value="{{ lease.ip }}">
            </div>

            <div class="mb-3">
                <label class="form-label">MAC</label>
                <input
                    class="form-control"
		    name="mac"
                    value="{{ lease.mac }}"
                    readonly>
            </div>

            <button class="btn btn-primary">
                Salvează
            </button>

            <a href="/" class="btn btn-secondary">
                Înapoi
            </a>
	</form>
        </div>

    </div>

</div>

</body>
</html>
