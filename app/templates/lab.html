<!doctype html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <title>Laborator testare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% include "navbar.html" %}

<div class="container py-4">
    <h2>Laborator testare iPXE + QEMU</h2>

    <div class="card shadow-sm mt-4">
        <div class="card-body">
            <h5>Verificare rapidă</h5>
            <pre>curl -s http://127.0.0.1:8099/boot.ipxe</pre>

            <h5>Pornire laborator</h5>
            <pre>cd /srv/docker/netcenter
./lab/start.sh</pre>

            <h5>Vizualizare mașină virtuală</h5>
            <pre>vncviewer 127.0.0.1:5901</pre>

            <h5>Oprire laborator</h5>
            <pre>pkill -f qemu-system-x86_64</pre>
        </div>
    </div>
</div>

</body>
</html>
